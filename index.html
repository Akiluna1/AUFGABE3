<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>HFU POSTER</title>
    <script src="https://aframe.io/releases/0.6.0/aframe.min.js"></script>
    <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>

  </head>

  <body style="margin: 0; overflow: hidden;">
   <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">
  
  <a-assets>
    <a-asset-item id="bookModel" src="MODELS/Book.glb"></a-asset-item>
    <a-asset-item id="cameraModel" src="MODELS/Camera.glb"></a-asset-item>
    <a-asset-item id="headsetModel" src="MODELS/Headset.glb"></a-asset-item>
    <a-asset-item id="laptopModel" src="MODELS/Laptop.glb"></a-asset-item>
    <a-asset-item id="microphoneModel" src="MODELS/Microphone.glb"></a-asset-item>
    <a-asset-item id="paletteModel" src="MODELS/Palette.glb"></a-asset-item>
    <a-asset-item id="pencilModel" src="MODELS/Pencil.glb"></a-asset-item>
  </a-assets>

  <a-marker type="pattern" url="MARKER/pattern-Hochschule_Furtwangen_HFU_logo.patt">
    <a-text value="Happy Christmas!" position="-1 4 0" color="white"></a-text>
    <a-entity 
      gltf-model="#bookModel"
      position="0 0 0"
      scale="0.4 0.4 0.4"
      rotation="0 45 0"
      animation-mixer>
    </a-entity>

    <a-entity 
      gltf-model="#cameraModel"
      position="1 0 0"
      scale="0.4 0.4 0.4"
      rotation="0 -30 0"
      animation-mixer>
    </a-entity>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>
<script src="script.js"></script>
  </body>
</html>
