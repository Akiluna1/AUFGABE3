<!DOCTYPE html>
<html>

<head>
    <title> HFU POSTER</title>
    <script src="js/aframe-v1.5.0.min.js"></script>
</head>

<body>
    <script src="js/simple-ar.min.js" onload="onWasmLoaded();"></script>
    <a-scene>
        <a-entity simple-ar="src: assets/target2.png; minCutOffValue: 1; betaValue:0.1;">
            <a-entity id="snow"></a-entity>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    
    <script>
      const targetObject = document.querySelector('#snow');

      const models = [
        'MODELS/GLB/Book.glb',
        'MODELS/GLB/Camera.glb',
        'MODELS/GLB/Headset.glb',
        'MODELS/GLB/Laptop.glb',
        'MODELS/GLB/Microphone.glb',
        'MODELS/GLB/Palette.glb',
        'MODELS/GLB/Pencil.glb'
      ];

      const total = 30; // number of models to spawn

      for (let i = 0; i < total; i++) {
        const modelEntity = document.createElement('a-entity');
        const modelUrl = models[i % models.length];

        let scaleNum;
        if (modelUrl.includes('Book.glb')) scaleNum = 0.6;
        else if (modelUrl.includes('Palette.glb')) scaleNum = 0.6;
        else if (modelUrl.includes('Pencil.glb')) scaleNum = 0.20;
        else if (modelUrl.includes('Headset.glb')) scaleNum = 0.01;
        else if (modelUrl.includes('Laptop.glb')) scaleNum = 0.20;
        else scaleNum = (Math.random() * 0.12 + 0.05).toFixed(2); // default for other models

        const startX = (Math.random() - 0.5) * 8;
        const startY = Math.random() * 6 + 2;
        const startZ = (Math.random() - 0.5) * 8;
        const endY = -10;

        modelEntity.setAttribute('gltf-model', modelUrl);
        modelEntity.setAttribute('position', `${startX} ${startY} ${startZ}`);
        modelEntity.setAttribute('scale', `${scaleNum} ${scaleNum} ${scaleNum}`);

        // Rotate Book, Palette, and Pencil to face the camera
        if (modelUrl.includes('Book.glb') || modelUrl.includes('Palette.glb') || modelUrl.includes('Pencil.glb')) {
            modelEntity.setAttribute('rotation', '75 0 0'); 
        }
        // Rotate Headset to the left
        if (modelUrl.includes('Headset.glb')) {
            modelEntity.setAttribute('rotation', '0 -90 0'); 
        }

        const duration = 4000 + Math.random() * 3000;

        modelEntity.setAttribute('animation__fall', {
          property: 'position',
          from: `${startX} ${startY} ${startZ}`,
          to: `${startX} ${endY} ${startZ}`,
          dur: duration,
          easing: 'linear',
          loop: true
        });

        modelEntity.addEventListener('animationloop', () => {
          const newX = (Math.random() - 0.5) * 8;
          const newY = Math.random() * 6 + 2;
          const newZ = (Math.random() - 0.5) * 8;

          modelEntity.setAttribute('animation__fall', {
            from: `${newX} ${newY} ${newZ}`,
            to: `${newX} ${endY} ${newZ}`,
            dur: 4000 + Math.random() * 3000
          });
        });

        targetObject.appendChild(modelEntity);
      }
    </script>
</body>

</html>
