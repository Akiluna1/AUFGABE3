<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>HFU AR Poster</title>
    <script src="js/aframe-v1.5.0.min.js"></script>
    <script src="js/aframe-marker-ar.js"></script>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam;" vr-mode-ui="enabled: false">
        <a-assets>
            <a-asset-item id="bookModel" src="MODELS/Book.glb"></a-asset-item>
            <a-asset-item id="cameraModel" src="MODELS/Camera.glb"></a-asset-item>
            <a-asset-item id="headsetModel" src="MODELS/Headset.glb"></a-asset-item>
            <a-asset-item id="laptopModel" src="MODELS/Laptop.glb"></a-asset-item>
            <a-asset-item id="microphoneModel" src="MODELS/Microphone.glb"></a-asset-item>
            <a-asset-item id="paletteModel" src="MODELS/Palette.glb"></a-asset-item>
            <a-asset-item id="pencilModel" src="MODELS/Pencil.glb"></a-asset-item>
        </a-assets>

        <a-marker type="pattern" url="pattern/pattern-user.patt" id="marker">
            <a-text value="Happy Christmas!" position="-1 4 0" color="white"></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const models = [
            '#bookModel',
            '#cameraModel',
            '#headsetModel',
            '#laptopModel',
            '#microphoneModel',
            '#paletteModel',
            '#pencilModel'
        ];

        const marker = document.querySelector('#marker');

        function randomPosition() {
            const x = (Math.random() - 0.5) * 2; // enger an Marker
            const y = Math.random() * 1.5 + 0.2;
            const z = (Math.random() - 0.5) * 2;
            return { x, y, z };
        }

        function randomRotation() {
            const x = Math.random() * 360;
            const y = Math.random() * 360;
            const z = Math.random() * 360;
            return { x, y, z };
        }

        for (let i = 0; i < 10; i++) {
            const modelId = models[Math.floor(Math.random() * models.length)];
            const entity = document.createElement('a-entity');

            entity.setAttribute('gltf-model', modelId);

            // zufällige Skalierung
            const scale = (Math.random() * 0.4 + 0.2).toFixed(2);
            entity.setAttribute('scale', `${scale} ${scale} ${scale}`);

            // zufällige Position & Rotation
            const pos = randomPosition();
            const rot = randomRotation();
            entity.setAttribute('position', pos);
            entity.setAttribute('rotation', rot);

            // Animation-Mixer für Modelle mit Animationen
            entity.setAttribute('animation-mixer', '');

            // Schweben auf Y-Achse
            entity.setAttribute('animation', {
                property: 'position',
                dir: 'alternate',
                dur: 3000 + Math.random() * 2000,
                easing: 'easeInOutSine',
                loop: true,
                to: { x: pos.x, y: pos.y + 0.5, z: pos.z }
            });

            // Rotation um Y-Achse
            entity.setAttribute('animation__rotate', {
                property: 'rotation',
                to: { x: rot.x, y: rot.y + 360, z: rot.z },
                dur: 10000 + Math.random() * 5000,
                loop: true,
                easing: 'linear'
            });

            marker.appendChild(entity);
        }
    </script>
</body>
</html>
